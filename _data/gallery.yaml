    de: "Das Bild zeigt einen Ausschnitt der Glasfassade und des Dachs des Paul-Löbe-Hauses in Berlin. Der sich im Fenster spiegelnde, wolkenlose Himmel lässt die schwere Betonplatte des Dachs schwebend wirken."
