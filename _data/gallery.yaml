- src: "/assets/images/gallery/downloads/25-03-01-68433.jpg"
  title:
    de: "Theaterplatz, Dresden"
    en: "Theaterplatz, Dresden"
  alt:
    de: "Das Bild zeigt eine Nachtszene auf dem Theaterplatz in Dresden. Im Vordergrund ist das Reiterstandbild von König Johann. zu sehen, während im Hintergrund eine Straßenbahn der Dresdener Verkehrsbetriebe vorbeifährt. Durch die Langzeitaufnahme erzeugt sie einen langen, gelb-weiß-roten Schweif. Die Straßenlaternen leichten sternförmig."
    en: "The photo shows a nighttime scene on Theaterplatz in Dresden. In the foreground is the equestrian statue of King Johann, while in the background a Dresden public transit tram passes by. Because it was taken with a long exposure, the tram leaves a long, yellow-white-red trail. The streetlights form a faint star shape."
  license: "CC BY 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by/4.0/"
  featured: true

