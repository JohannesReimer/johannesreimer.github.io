- src: "/assets/images/gallery/downloads/26-03-28-72475-62.jpg"
  title:
    de: "Verbindungsbrücke über den Brooksfleet, Speicherstadt Hamburg"
    en: "Skyway Bridge over the Brooksfleet, Speicherstadt Hamburg"
  alt:
    de: "Speichergebäude und Verbindungsbrücke über den Brooksfleet in der Hamburger Speicherstadt. Die Form der quadratischen Öffnungen des Vierendeel-Trägers wird auch in den Fassaden der angrenzenden Speichergebäude aufgenommen: Im rechten Gebäude ist dies eine Backsteinfassade mit regelmäßigen rechteckigen, gitterartigen Öffnungen; auf der linken Seite sieht man ein modernes Stahl- und Stahlbetongebäude mit verglasten Fensterbändern.   "
    en: "Warehouse buildings and a connecting skyway bridge over the Brooksfleet in Hamburg’s Speicherstadt. The shape of the square openings in the Vierendeel truss is also reflected in the facades of the adjacent warehouse buildings: The building on the right features a brick facade with regular, rectangular, lattice-like openings; on the left, a modern steel and reinforced concrete building with bands of glass windows is visible."
