- src: "/assets/images/gallery/downloads/24-11-30-66829.jpg"
  title:
    de: "Bundeskanzleramt, Berlin"
    en: "Federal Chancellery, Berlin"
  alt:
    de: "Das Bild zeigt das Bundeskanzleramt in Berlin, fotografiert vom Haus der Kulturen der Welt (ehemalige Kongresshalle bzw. 'Schwangere Auster'). Im Vordergrund weht unscharf ein regenbogenfarbiger Vorhang, der im Kontrast zu der modernen Glas- und Betonarchitektur steht."
