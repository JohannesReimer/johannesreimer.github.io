- src: "/assets/images/gallery/downloads/24-09-12-64956.jpg"
  title:
    de: "Eingestürzte Carola-Brücke, Dresden"
    en: "Collapsed Carola Bridge, Dresden"
  alt:
    de: "Das Bild zeigt den Eingestürzten Brückenzug C der Carola-Brücke in Dresden. Die Trümmer der Stromöffnung liegen im Wasser, während die Spannweite über den Elbwiesen sichtbar durchhängt. Im Vordergrund sind Schaulustige zu sehen, im Hintergrund die Sächsische Staatskanzlei."
    en: "The photo shows the collapsed Bridge Section C of the Carola Bridge in Dresden. The debris from the river opening lies in the water, while the span over the Elbe meadows is visibly sagging. Onlookers can be seen in the foreground, with the Saxon State Chancellery in the background."
  license: "CC BY 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by/4.0/"

- src: "/assets/images/gallery/downloads/24-11-30-66756.jpg"
  title:
    de: "Plattenbau, Berlin"
    en: "Plattenbau, Berlin"
  alt:
    de: "Das Bild zeigt die Fassade eines typischen Plattenbaus in Berlin-Mitte. Der Ausschnitt ist so gewählt, dass man kein Gefühl für die Gesamtgröße des Gebäudes bekommt. Die sich wiederholenden Linien und Strukturen zeugen von der rationslisierten Bauweise."
    en: "The photo shows the facade of a typical prefabricated building (Plattenbau) in Berlin-Mitte. The picture is composed in such a way that one cannot get a sense of the building’s overall size. The repetitive lines and structures are characteristic of this rationalized style of construction."
  license: "CC BY 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by/4.0/"

